<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WriteFlow - AI PDF Reader</title>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f7fa; 
            color: #333; 
            padding: 40px; 
            text-align: center; 
        }

        input, button { 
            margin: 8px; 
            padding: 10px 15px; 
            font-size: 16px; 
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        button {
            background-color: #1a73e8;
            color: white;
        }

        button:hover {
            background-color: #1557b0;
        }

        #result { 
            margin-top: 20px; 
            white-space: pre-wrap; 
            text-align: left; 
            max-width: 700px; 
            margin: auto; 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            max-height: 450px;
            overflow-y: auto;
        }

        .word {
            margin: 2px;
            display: inline-block;
            transition: 0.2s;
        }

        .highlight {
            background: yellow;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .speed-control {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>WriteFlow - AI PDF Reader</h1>
    <p>Upload PDF → Extract Text → Listen 🎧</p>

    <input type="file" id="pdfFile" accept=".pdf" />

    <div>
        <!-- 🔥 FIX 1: onclick hata ke id diya -->
        <button id="uploadBtn">Upload PDF</button>

        <button onclick="speakText()">▶ Listen</button>
        <button onclick="pauseSpeech()">⏸ Pause</button>
        <button onclick="resumeSpeech()">⏯ Resume</button>
        <button onclick="stopSpeech()">⏹ Stop</button>
    </div>

    <div class="speed-control">
        <label>Speed: <span id="speedValue">1x</span></label><br>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
    </div>

    <div id="result"></div>

    <!-- 🔥 FIX 2: correct static path -->
    <script src="/static/script.js"></script>

</body>
</html>
